<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Kian Harrison · Security</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14100f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2314100f'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='monospace' font-size='16' font-weight='700' fill='%23e08a6d'%3EKH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#14100f;--line:#2c2321;--line-2:#3d302c;--surface:#1e1716;--text:#f0e6dc;--text-2:#c9bbaf;--mute:#9a8b80;--accent:#e08a6d;--accent-2:#f2b29a;--on-accent:#1a0f0b;--crit:#e5584a;
  --serif:"Newsreader",Georgia,serif;--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:400 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;padding:40px 24px}
main{width:min(640px,100%)}
.term{font-family:var(--mono);font-size:14px;color:var(--text-2);border:1px solid var(--line);border-radius:12px;padding:16px 24px;margin:0 0 40px;background:#191312;white-space:pre-wrap;overflow-wrap:anywhere}
.term .p{color:var(--accent)}.term .e{color:var(--crit)}.term .m{color:var(--mute)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(40px,8vw,64px);line-height:1.05;letter-spacing:-.02em;margin:0 0 16px}
p{color:var(--text-2);font-size:17px;max-width:52ch;margin:0 0 40px}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:10px 18px;border-radius:8px;background:var(--accent);color:var(--on-accent);font:500 15px/1.2 var(--sans);text-decoration:none;transition:background .15s}
.btn:hover{background:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001ms!important}}
</style>
</head>
<body>
<main>
<div class="term" aria-hidden="true"><span class="p">kian@lab:~$</span> curl -I <span id="u">/this-page</span>
<span class="e">HTTP/1.1 404 Not Found</span>
<span class="m"># out of scope: nothing listening here</span></div>
<h1>Nothing on this port.</h1>
<p>The page you asked for doesn't exist, or it moved. The lab, the reports and my contact details are all on the home page.</p>
<a class="btn" href="/">Back to the home page</a>
</main>
<script>document.getElementById("u").textContent = location.pathname.slice(0, 60);</script>
</body>
</html>
